name: Build MissApp Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run dist:win -- --publish never

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe
          if (-not $exe) { throw "No Windows EXE was produced." }
          $exe | Select-Object FullName, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissApp-Windows-EXE
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
