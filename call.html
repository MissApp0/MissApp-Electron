<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MissApp Call</title><style>html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;background:#081216;color:#fff}body{display:grid;place-items:center}.card{text-align:center;padding:28px;width:100%;box-sizing:border-box}.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#17332e;font-size:38px;font-weight:700}.name{font-size:25px;font-weight:700}.type{opacity:.7;margin:8px 0 28px}.actions{display:flex;justify-content:center;gap:18px}.button{width:64px;height:64px;border:0;border-radius:50%;font-size:25px;color:#fff;cursor:pointer}.accept{background:#247a52}.decline{background:#9d3038}.end{background:#9d3038}.hidden{display:none}.hint{margin-top:20px;font-size:12px;opacity:.55}</style></head><body><main class="card"><div id="avatar" class="avatar">M</div><div id="name" class="name">MissApp</div><div id="type" class="type">Incoming call</div><div id="actions" class="actions"><button id="decline" class="button decline">✕</button><button id="accept" class="button accept">✓</button></div><div id="active" class="hidden"><button id="end" class="button end">☎</button></div><div class="hint">Always on top</div></main><script>
let callId=null;let outgoing=false;
window.missappDesktop.onCallInfo(info=>{callId=info.callId;outgoing=Boolean(info.outgoing);document.getElementById("name").textContent=info.callerName||"User";document.getElementById("type").textContent=info.title||"Incoming call";if(outgoing){document.getElementById("accept").classList.add("hidden");document.getElementById("decline").textContent="☎";}document.getElementById("avatar").textContent=(info.callerName||"U").charAt(0).toUpperCase()});
document.getElementById("accept").onclick=()=>window.missappDesktop.callAction?.({type:"accept",callId});
document.getElementById("decline").onclick=()=>window.missappDesktop.callAction?.({type:"decline",callId});
document.getElementById("end").onclick=()=>window.missappDesktop.callAction?.({type:"end"});
</script></body></html>
